name: Community CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # El crate declara `rust-version` en el Cargo.toml raíz, pero la CI solo
  # compilaba con el toolchain fijado: hasta 0.9.3 no compilaba con Rust
  # anterior a 1.96 y nadie lo notó. Este job compila con esa versión mínima.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install the minimum supported Rust
        run: |
          MSRV=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "MSRV=$MSRV" >> "$GITHUB_ENV"
          rustup toolchain install "$MSRV" --profile minimal
      - name: Check with the minimum supported Rust
        run: cargo +"$MSRV" check -p nopaldb --features full

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Antes de compilar: tres READMEs enlazaron meses a archivos inexistentes.
      - name: Check doc links
        run: python3 scripts/check_doc_links.py

      # La receta de GRAPHRAG.md debe ser el código de graphrag_sample.py (#230).
      - name: Check GraphRAG recipe
        run: python3 scripts/check_graphrag_recipe.py

      # Los contratos de NQL (docs/NQL_SEMANTICS.md) citan sus tests.
      - name: Check NQL semantics test citations
        run: python3 scripts/check_semantics_tests.py

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Check default features
        run: cargo check -p nopaldb

      # `embeddings` sin `embeddings-index` no compiló durante meses porque
      # ningún paso probaba esa combinación.
      - name: Check embeddings without the HNSW index
        run: cargo check -p nopaldb --features embeddings

      # El índice HNSW (y su copia interna de hnsw_rs) sin `hybrid`: un helper
      # que solo usa `search_hybrid` quedaba como código muerto (#288).
      - name: Check the HNSW index without hybrid
        run: cargo check -p nopaldb --features embeddings-index

      # Los ejemplos no los compilaba nadie y dos dejaron de compilar.
      - name: Examples compile-check
        run: cargo check -p nopaldb --features full --examples

      # `cargo bench --no-run` no sirve aquí: el perfil release lleva
      # `panic = "abort"` y el harness de los benches exige `unwind`, así que
      # las dependencias compiladas para release chocan ("requires panic
      # strategy abort"). `cargo check --benches` compila los benches en
      # perfil dev, que es lo que este paso necesita: que no se rompan.
      - name: Benches compile-check
        run: cargo check -p nopaldb --features core --benches

      # Los tests de integración solo se compilaban con `core` o `full`, que
      # traen `analytics`: un test que usaba `history_to_arrow` sin su `cfg`
      # llegó a main sin compilar con `hybrid` (#322).
      - name: Tests compile-check without analytics (hybrid)
        run: cargo check -p nopaldb --features hybrid --tests

      - name: Clippy (semantic)
        run: cargo clippy -p nopaldb --features semantic -- -D warnings

      - name: Test core tier
        run: cargo test -p nopaldb --features core --lib

      # Sin python: el link de tests PyO3 se valida via maturin, no aqui
      - name: Test semantic tier (rust-only)
        run: cargo test -p nopaldb --features core,reasoner,owl-import,shacl --lib

      # `--lib` no compila tests/: los tres tests de integración del puente
      # Turtle no corrieron en CI hasta 0.5.10.
      - name: Test Turtle bridge integration
        run: cargo test -p nopaldb --features semantic --test owl_import_integration_test --test rdf_roundtrip_test --test rdf_export_symmetry_test --test synthetic_offshore_e2e_test --test nql_instanceof_edges_test --test shacl_validation_test --test shacl_turtle_test

      - name: Test isolation feature (full-isolation)
        run: cargo test -p nopaldb --features full-isolation --test p1_isolation_levels_test --test deadlock_tests --test p1_isolation_concurrent_test

      - name: Test clock persistence and concurrency regressions
        run: cargo test -p nopaldb --test clock_persistence_test --test concurrent_writers_test --test adjacency_update_regression_test

      - name: Test crash recovery (SIGKILL harness)
        run: cargo test -p nopaldb --test crash_commit_test

      - name: Test idempotent upsert (M1-4)
        run: cargo test -p nopaldb --features core --test upsert_test

      - name: Test delete-by-key / reconcile
        run: cargo test -p nopaldb --features core --test delete_by_key_test

      - name: Test hybrid search (M1-5)
        run: cargo test -p nopaldb --features core --test hybrid_test --test hybrid_explain_test --test hybrid_label_check_test --test fulltext_analyzer_test --test fulltext_batch_commit_test --test hybrid_selective_filter_test --test candidate_set_test

      - name: Test filtered KNN recall (exact path + native HNSW filter)
        run: cargo test -p nopaldb --features core --test knn_filtered_recall_test --test knn_exact_test --test hnsw_incremental_test --test hnsw_persistence_test --test hnsw_reachability_test --test bulk_embeddings_test --test neighborhood_ppr_test --test leiden_options_test --test leiden_planted_test --test leiden_hierarchy_test --test community_materialize_test --test community_universe_test --test nql_in_community_test --test community_reports_test --test nql_similar_to_escalation_test --test nql_score_test --test nql_two_hops_test --test nql_where_candidates_test --test nql_parens_and_literals_test --test nql_pattern_expansion_test --test nql_pattern_properties_test

      - name: Test indexed-node lifecycle (overwrite retracts, delete purges)
        run: cargo test -p nopaldb --features core --test index_lifecycle_test

      - name: Test sack traversal (accumulator)
        run: cargo test -p nopaldb --features core --test sack_traversal_test

      - name: Test PropertyValue conversion API
        run: cargo test -p nopaldb --features core --test property_value_conversion_test --test export_test --test parquet_codecs_test --test parquet_import_test --test arrow_export_contract_test --test export_snapshot_test

      - name: Test EXPLAIN honesty (plan == execution)
        run: cargo test -p nopaldb --features core --test nql_explain_honesty_test

      - name: Test property index v2 (typed keys + migration)
        run: cargo test -p nopaldb --features core --test prop_index_v2_test

      - name: KV conformance (redb)
        run: cargo test -p nopaldb --features core --lib conformance

      - name: CLI `nopaldb migrate` / `nopaldb engine` (binary run end to end)
        run: cargo test -p nopaldb --features cli --test cli_migrate_test

      - name: Engine autodetection (sled databases give the migration recipe) + verified copy (copy_database round-trip)
        run: cargo test -p nopaldb --features core --test engine_autodetect_test --test kv_migrate_test --test open_lock_same_process_test --test hnsw_persistence_test

      - name: Layout v2 migration (v1→v2 state machine)
        run: cargo test -p nopaldb --features core --test layout_v2_migration_test

      - name: Read-only mode + cold backup — redb
        run: cargo test -p nopaldb --features core --test read_only_and_backup_test

      - name: Cold-start crash (kill while creating the database) — redb
        run: cargo test -p nopaldb --features core --test cold_start_crash_test


  python-stubs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build extension + check stubs (guard against .pyi drift)
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --quiet maturin mypy "networkx>=3.0"
          maturin develop -m nopaldb/Cargo.toml
          make check-python PYTHON=python
